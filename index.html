<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PVS6 Solar Panel Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>PVS6 Solar Panel Monitor</h1>
            <div class="controls">
                <button id="refreshNow">Refresh Now</button>
                <button id="fitAll">Fit All</button>
                <button id="diagnostics">Diagnostics</button>
                <button id="settingsBtn">Settings</button>
            </div>
        </header>

        <!-- Settings dialog -->
        <dialog id="settingsDialog">
            <div class="dialog-header">
                <h2>Settings</h2>
                <button class="dialog-close" id="settingsClose" aria-label="Close">&times;</button>
            </div>
            <div class="dialog-body">
                <div class="setting-row">
                    <label for="refreshInterval">Refresh interval (minutes)</label>
                    <input type="number" id="refreshInterval" min="1" value="5" />
                </div>
                <div class="setting-row">
                    <label for="detailedMode">Detailed hover tooltip</label>
                    <label class="toggle-label">
                        <input type="checkbox" id="detailedMode" role="switch" />
                        <span class="toggle-track"><span class="toggle-thumb"></span></span>
                    </label>
                </div>
                <div class="setting-row">
                    <label for="editPlacement">Edit panel placement</label>
                    <label class="toggle-label">
                        <input type="checkbox" id="editPlacement" role="switch" />
                        <span class="toggle-track"><span class="toggle-thumb"></span></span>
                    </label>
                </div>
                <div class="setting-row">
                    <label>Save layout to server</label>
                    <button id="saveLayout">Save to Server</button>
                </div>
                <div class="setting-row">
                    <label>Export layout as JSON file</label>
                    <button id="exportLayout">Export Layout</button>
                </div>
            </div>
        </dialog>

        <div id="nightModeBanner" class="night-mode-banner hidden">
            All panels offline — no power detected (nighttime or grid disconnected)
        </div>
        <div id="canvasContainer">
            <svg id="panelCanvas" width="100%" height="100%"></svg>
            <div class="color-legend">
                <div class="legend-title">Output</div>
                <div class="legend-gradient"></div>
                <div class="legend-labels">
                    <span>0 W</span>
                    <span>Peak</span>
                </div>
                <div class="legend-underperforming">
                    <span class="legend-swatch"></span>
                    <span>Underperforming</span>
                </div>
            </div>
            <div class="zoom-hint">Scroll to zoom &middot; Middle-drag to pan</div>
        </div>
        <div id="summaryBox" class="summary-box">
            <h3>Power Summary</h3>
            <div class="summary-content">
                <div class="summary-item">
                    <span class="summary-label">Total Power:</span>
                    <span class="summary-value" id="totalPower">0 W</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Active Panels:</span>
                    <span class="summary-value" id="activePanels">0</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Total Panels:</span>
                    <span class="summary-value" id="totalPanels">0</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Avg per Panel:</span>
                    <span class="summary-value" id="avgPower">—</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Last Updated:</span>
                    <span class="summary-value summary-value--small" id="lastUpdated">—</span>
                </div>
            </div>
        </div>
        <div id="tooltip" class="tooltip hidden"></div>
    </div>
    <script src="diagnostic.js"></script>
    <script src="app.js"></script>
</body>
</html>
